<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{color-scheme:light dark}body{margin:0}img{max-width:100%}</style>
<title>制度管理办法审阅底稿</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F1F4F1; --card:#FFFFFF; --card2:#F7F9F7;
  --ink:#1A211E; --ink2:#3D4844; --muted:#64716B;
  --rule:#D4DCD6; --rule2:#E4EAE5;
  --red:#9B3A28; --red-soft:#F3E4E0;
  --A:#2E6B4E; --A-soft:#E4EFE9;
  --B:#8A6320; --B-soft:#F3EADA;
  --C:#657069; --C-soft:#E8ECE9;
  --shadow:0 1px 2px rgba(26,33,30,.06);
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --serif:"Songti SC","STSong","SimSun",Georgia,serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141817; --card:#1B211E; --card2:#212825;
    --ink:#E7EDE9; --ink2:#C3CDC7; --muted:#8B9891;
    --rule:#2C3531; --rule2:#242C29;
    --red:#CC6A53; --red-soft:#38231D;
    --A:#6FB48F; --A-soft:#1C3026;
    --B:#C9A05A; --B-soft:#2F2819;
    --C:#8B9891; --C-soft:#242B28;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#141817; --card:#1B211E; --card2:#212825;
  --ink:#E7EDE9; --ink2:#C3CDC7; --muted:#8B9891;
  --rule:#2C3531; --rule2:#242C29;
  --red:#CC6A53; --red-soft:#38231D;
  --A:#6FB48F; --A-soft:#1C3026;
  --B:#C9A05A; --B-soft:#2F2819;
  --C:#8B9891; --C-soft:#242B28;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.75;
  margin:0; padding-block:32px 60px; padding-left:18px; padding-right:18px;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:900px; margin:0 auto; display:flex; flex-direction:column; gap:24px}
header{display:flex; flex-direction:column; gap:10px}
.eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted)}
h1{font-family:var(--serif); font-weight:600; font-size:29px; line-height:1.3; margin:0; letter-spacing:.02em; text-wrap:balance}
.sub{color:var(--ink2); font-size:14px; margin:0; max-width:62ch}
.howto{
  font-size:13px; color:var(--ink2); background:var(--card2);
  border:1px solid var(--rule2); border-left:2px solid var(--red);
  padding:9px 13px; margin:0;
}
.meta{
  display:flex; flex-wrap:wrap; gap:4px 20px; font-family:var(--mono);
  font-size:12px; color:var(--muted); border-top:1px solid var(--rule); padding-top:10px;
}
.tally{display:flex; flex-wrap:wrap; background:var(--card); border:1px solid var(--rule); box-shadow:var(--shadow)}
.t-cell{flex:1 1 90px; padding:12px 16px; border-right:1px solid var(--rule2); display:flex; flex-direction:column; gap:1px}
.t-cell:last-of-type{border-right:none}
.t-num{font-family:var(--mono); font-size:22px; font-weight:600; font-variant-numeric:tabular-nums; line-height:1.2}
.t-lab{font-size:11px; color:var(--muted); letter-spacing:.08em}
.t-take .t-num{color:var(--A)} .t-skip .t-num{color:var(--muted)} .t-pend .t-num{color:var(--red)}
.sync{padding:8px 16px; font-family:var(--mono); font-size:11px; color:var(--muted); border-top:1px solid var(--rule2); flex-basis:100%}
.sync b{color:var(--A); font-weight:500}
#tiers{display:flex; flex-direction:column; gap:28px}
.tier{display:flex; flex-direction:column; gap:9px}
.tier-head{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.tier-tag{font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:.1em; padding:2px 7px; border:1px solid currentColor}
.tier-name{font-family:var(--serif); font-size:19px; font-weight:600; letter-spacing:.02em}
.tier-note{font-size:13px; color:var(--muted); flex:1 1 240px; min-width:0}
.tier-A .tier-tag,.tier-A .tier-name{color:var(--A)}
.tier-B .tier-tag,.tier-B .tier-name{color:var(--B)}
.tier-C .tier-tag,.tier-C .tier-name{color:var(--C)}
.item{background:var(--card); border:1px solid var(--rule); box-shadow:var(--shadow); border-left:3px solid var(--rule)}
.item[data-s="take"]{border-left-color:var(--A)}
.item[data-s="skip"]{border-left-color:var(--rule); opacity:.55}
.item[data-s="pending"]{border-left-color:var(--red)}
.row{display:grid; grid-template-columns:auto 1fr auto; gap:13px; align-items:start; padding:12px 15px}
.idx{font-family:var(--mono); font-size:12px; font-weight:600; color:var(--red); padding-top:3px; letter-spacing:.04em}
.rowmid{min-width:0; display:flex; flex-direction:column; gap:2px; cursor:pointer; background:none; border:0; padding:0; text-align:left; font:inherit; color:inherit}
.rowmid:focus-visible{outline:2px solid var(--red); outline-offset:3px}
.clause{font-family:var(--mono); font-size:12px; color:var(--muted); letter-spacing:.02em; display:flex; align-items:center; gap:6px}
.chev{display:inline-block; font-size:9px; color:var(--red); transition:transform .15s}
.item.open .chev{transform:rotate(90deg)}
.gist{font-size:15px; line-height:1.55; color:var(--ink)}
.item.open .gist{font-weight:600}
.toggle{display:flex; border:1px solid var(--rule); align-self:start}
.toggle button{font-family:var(--sans); font-size:12px; padding:5px 11px; border:0; background:transparent; color:var(--muted); cursor:pointer; line-height:1.6; border-right:1px solid var(--rule)}
.toggle button:last-child{border-right:0}
.toggle button:hover{background:var(--card2); color:var(--ink2)}
.toggle button:focus-visible{outline:2px solid var(--red); outline-offset:-2px}
.toggle button.b-take[aria-pressed="true"]{background:var(--A-soft); color:var(--A); font-weight:600}
.toggle button.b-skip[aria-pressed="true"]{background:var(--C-soft); color:var(--ink2); font-weight:600}
.detail{border-top:1px dashed var(--rule); padding:15px; display:flex; flex-direction:column; gap:14px}
.detail h4{margin:0 0 5px; font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:.12em; color:var(--muted); text-transform:uppercase}
.detail p{margin:0; color:var(--ink2); font-size:14px; line-height:1.8}
.quote{background:var(--card2); border-left:2px solid var(--red); padding:11px 14px; font-family:var(--serif); font-size:14px; line-height:1.85; color:var(--ink2); overflow-x:auto}
.quote p{margin:0 0 7px; font-family:var(--serif)}
.quote p:last-child{margin-bottom:0}
.quote em{font-style:normal; background:var(--red-soft); padding:0 3px; color:var(--ink)}
.quote .law{border-top:1px solid var(--rule); margin-top:9px; padding-top:9px}
.quote .none{color:var(--muted)}
.fix{background:var(--A-soft); padding:11px 14px; border-left:2px solid var(--A)}
.fix p{color:var(--ink)}
.risk{display:flex; gap:9px; align-items:baseline; font-size:13px; color:var(--muted); border-top:1px solid var(--rule2); padding-top:11px}
.risk-lab{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; white-space:nowrap}
.hidden{display:none!important}
.summary{background:var(--card); border:1px solid var(--rule); box-shadow:var(--shadow); padding:18px}
.summary h3{font-family:var(--serif); font-size:18px; margin:0 0 3px; font-weight:600}
.summary .hint{font-size:13px; color:var(--muted); margin:0 0 13px}
#sumlist{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:7px}
#sumlist li{display:grid; grid-template-columns:auto 1fr; gap:11px; font-size:14px; color:var(--ink2); padding-bottom:7px; border-bottom:1px solid var(--rule2)}
#sumlist li:last-child{border-bottom:0; padding-bottom:0}
#sumlist .sidx{font-family:var(--mono); font-size:12px; color:var(--red); font-weight:600; padding-top:2px}
.empty{color:var(--muted); font-style:italic}
footer{font-family:var(--mono); font-size:11px; color:var(--muted); text-align:right; letter-spacing:.04em}
@media (max-width:560px){
  .row{grid-template-columns:auto 1fr; gap:11px}
  .toggle{grid-column:2; margin-top:4px}
  h1{font-size:24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
<header>
  <div class="eyebrow">稽核审计部 · 制度征求意见</div>

<script type="application/json" id="tiers-data">[{"t": "A", "name": "对本部门有直接利害", "note": "支撑推掉第二十九条的年度职能，或防止后续职责被追加。建议提出。"}, {"t": "B", "name": "实质性缺陷", "note": "制度设计或合法性问题，主责在其他部门，不涉及本部门职责。"}, {"t": "C", "name": "技术性问题", "note": "流程断点、表述不清、待补事项。可整批提出，基本无对抗成本。"}]</script>
<script type="application/json" id="items-data">[{"id": "A1", "tier": "A", "clause": "第十三条 / 第二十九条（一）（四）", "gist": "同一年度的制度执行情况自查，制度里安排了三轮", "quote": "<p><b>第十三条</b>　<em>综合管理部</em>每年<em>组织</em>各制度归口管理部门对相关制度的<em>执行情况进行自查</em>。各归口管理部门根据自查结果及实际工作需要，填报年度制度“废改立”计划……</p>\n<p><b>第二十九条（一）</b>　<em>稽核审计部</em>每年制定检查计划，<em>组织</em>各制度归口部门开展<em>制度执行情况自查</em>，并对各部门自查情况进行复核或抽查验证，形成评价及整改意见；</p>\n<p><b>第二十九条（四）</b>　各制度归口管理部门根据制度管理要求<em>开展自查</em>，发现执行问题并落实整改。</p>", "why": "同一年度、同一事项——制度执行情况自查——制度中安排了三次：综合管理部组织一次（用于填报“废改立”计划），本部门组织一次（用于执行检查），归口部门自身再开展一次。各部门一年需应付三轮内容高度重叠的自查。<br><br>第二十九条第（二）项与第（四）项亦重复：前者为归口部门“对归口领域制度执行情况开展检查”，后者为归口部门“开展自查”，实为同一动作。", "fix": "第二十九条第（一）项的“组织自查”职能并入第十三条，由综合管理部统一组织一次年度自查，自查结果同时用于填报“废改立”计划和制度执行评价；稽核审计部按年度审计计划对重点领域实施审计监督。第（四）项与第（二）项合并。", "risk": "本条的价值在于把“推掉第二十九条第（一）项”从“我们人手不够”变成“制度内部重复设置”。前者是陈述困难，后者是指出制度缺陷，分量不同；且第十三条是综合管理部自己写的，不易反驳。建议写入 Excel 第二十九条一格的“原因”作为第 4 点，与该条一并提出。"}, {"id": "A2", "tier": "A", "clause": "第三十七条", "gist": "整改的督办主体、时限、验证责任均未规定，存在后续被追加给本部门的风险", "quote": "<p><b>第三十七条</b>　持续改进<br>各制度归口管理部门对评价、监督及自查中发现的问题，应及时制定并落实整改措施，并根据运行分析、内控评价、风险合规检查及上级单位考核结果，评估制度有效性，并按程序推动制度的修订、废止或优化。</p>", "why": "本条只规定了整改的责任主体（归口管理部门），未规定<b>由谁督办、何时完成、谁验证整改到位</b>。而第二十九条第（一）项又要求本部门“形成评价及整改意见”——提出整改意见的部门，在实践中极易被顺理成章地要求承担整改跟踪与验证，形成新的年度固定工作量。<br><br>这是一处目前尚未落到本部门、但极可能在执行中落过来的缺口。", "fix": "在第三十七条中增加：“整改工作由综合管理部统筹督办，归口管理部门应在收到问题反馈之日起三十个工作日内制定整改措施并反馈整改结果；综合管理部汇总整改情况并纳入年度制度评价。”", "risk": "纯防御性条款，把督办责任事先锁定在制度统筹管理部门。综合管理部作为起草部门本就是制度统筹方，承接顺理成章，对抗成本低。建议与 A1 一并提出。"}, {"id": "B1", "tier": "B", "clause": "第三十五条（一）（与第三十三条对照）", "gist": "制度“降级”只需总经理审定，可绕过党委会、董事会的审批权限", "quote": "<p><b>第三十五条（一）</b>　一级、二级管理制度<em>下调为三级管理制度</em>的，由制度归口部门通过钉钉系统提交发起流程，经部门分管领导审批同意后，由制度管理办公室进行审核，<em>报总经理审定</em>；</p>\n<p><b>第三十五条（二）</b>　三级管理制度<em>上调为</em>一级、二级管理制度的，制度归口部门应按照上调后级别对应的审批权限，依照本办法第二十一条规定，<em>逐级提交相应决策会议审议通过</em>。</p>\n<p><b>第三十三条（二）</b>　独立废止，其<em>审议、决策及批准程序应与制定该制度时的原程序保持一致</em>。</p>", "why": "按附件 5，一级、二级管理制度视内容需经公司党委会、总经理办公会或董事会审批；三级管理制度仅需分管领导签批。<br><br>第三十五条第（一）项意味着：通过一个由总经理审定的“降级”动作，本应提交党委会或董事会审议的制度，可以变为分管领导签批即可修订发布。<b>降低管控的方向反而程序更简，提高管控的方向程序更严</b>，第（一）（二）两项不对称。<br><br>同时与第三十三条第（二）项的逻辑冲突：废止制度尚且要求“与制定该制度时的原程序保持一致”，降级这一实质上削弱管控层级的动作却无此要求。", "fix": "第三十五条第（一）项修改为：“一级、二级管理制度下调为三级管理制度的，应当按照该制度制定时的审批权限，依照本办法第二十一条规定，逐级提交相应决策会议审议通过。”（与第（二）项及第三十三条第（二）项保持一致）", "risk": "不涉及本部门职责，主责在综合管理部。论据完全来自制度自身条款之间的不一致，属于指出文本冲突而非提出新要求，对抗成本低。从审计角度看，这是本次发现中风险等级最高的一条——审批权限被规避的通道。"}, {"id": "B2", "tier": "B", "clause": "第二十一条第二款（及全文）", "gist": "涉及员工切身利益制度的民主程序表述与《劳动合同法》第四条不符，且全文未规定公示告知义务", "quote": "<p><b>第二十一条第二款</b>　在制定、修改或者决定有关劳动报酬、工作时间等涉及劳动者切身利益的规章制度时，应依法律规定<em>经职工代表大会讨论通过</em>。</p>\n<p class=\"law\"><b>《中华人民共和国劳动合同法》第四条第二款</b>　用人单位在制定、修改或者决定有关劳动报酬、工作时间、休息休假、劳动安全卫生、保险福利、职工培训、劳动纪律以及劳动定额管理等直接涉及劳动者切身利益的规章制度或者重大事项时，应当<em>经职工代表大会或者全体职工讨论，提出方案和意见，与工会或者职工代表平等协商确定</em>。</p>\n<p><b>同条第四款</b>　用人单位应当将直接涉及劳动者切身利益的规章制度和重大事项决定<em>公示，或者告知劳动者</em>。</p>", "why": "两处偏差：<br><br><b>一是民主程序的表述。</b>法律要求的是“讨论—提出方案和意见—与工会或职工代表平等协商确定”，制度写为“经职工代表大会讨论通过”。法律并未要求职代会表决通过，制度的表述既不准确，实际执行时也可能因职代会未形成表决而被认为程序未完成。<br><br><b>二是公示告知义务缺失。</b>《劳动合同法》第四条第四款将公示或告知作为强制义务，司法实践中亦是规章制度对劳动者产生效力的要件。本办法第二十六条仅规定“宣贯培训”，未将公示或告知及其留痕作为此类制度的生效要件。一旦发生劳动争议，公司可能因无法证明已履行公示告知义务而承担不利后果。", "fix": "第二十一条第二款修改为：“在制定、修改或者决定有关劳动报酬、工作时间、休息休假、劳动安全卫生、保险福利、职工培训、劳动纪律以及劳动定额管理等直接涉及劳动者切身利益的规章制度时，应当经职工代表大会或者全体职工讨论，提出方案和意见，与工会或者职工代表平等协商确定。”<br><br>第二十六条增加一款：“直接涉及劳动者切身利益的制度，发布后应当以公示或书面告知方式送达全体员工，并留存签收、公示照片或系统送达记录等证据，存入制度档案。”", "risk": "合法性问题，属于制度审阅的本职范围，且引用的是法律原文，不存在判断分歧。主责为综合管理部与组织人事部门，不涉及本部门职责。方向是帮公司规避劳动争议败诉风险，接受度高。"}, {"id": "B3", "tier": "B", "clause": "第四十二条 / 附件 5", "gist": "部门级制度无需评审、无需备案，但要求“不得与公司制度相冲突”却无任何保障机制", "quote": "<p><b>第四十二条</b>　部门级制度是公司各职能部门为落实公司制度、规范本部门内部职能运作、岗位操作或专项工作而制定的制度，其效力范围仅限于本部门内部，<em>不得与公司制度相冲突</em>。</p>\n<p><b>附件 5</b>（部门级制度行）　评审部门：<em>无需评审</em>；审核环节：部门负责人；审批流程：由部门相关会议审议通过后即可施行；备案：<em>自行管理</em>。</p>", "why": "部门级制度不经任何公司层面的审核（含法律合规审查），也不报备案，公司层面无从知悉各部门究竟制定了哪些部门级制度、内容为何。第四十二条“不得与公司制度相冲突”因此成为一句没有实现机制的宣示。<br><br>实质风险有三：部门级制度可能涉及员工权益（如部门内部的考勤、绩效分配规则），该类内容按《劳动合同法》第四条应履行民主程序与公示义务；可能与公司级制度的流程、权限相冲突而无人发现；本部门开展审计时亦无从获取完整的部门级制度清单，审计依据不完整。", "fix": "第四十二条增加一款：“部门级制度应当自发布之日起十个工作日内报综合管理部备案，由综合管理部建立部门级制度清单；涉及员工权益、跨部门事项或对外承诺的，发布前应当经法律合规部审查。”<br><br>附件 5“部门级制度”行的“备案”栏由“自行管理”调整为“报综合管理部备案”。", "risk": "触及各业务部门的一项便利（部门级制度不受约束），但要求仅为“备案”而非“审批”，负担很轻。备案接收方为综合管理部，审查方为法律合规部，不新增本部门职责。"}, {"id": "B4", "tier": "B", "clause": "第四十条（与第四十一条对照）", "gist": "责任追究的查处主体缺失，且与第四十一条的关系不清", "quote": "<p><b>第四十条</b>　制度执行中涉及相关部门或个人违规违纪违法责任的<em>应当查处和问责</em>，根据<em>公司会议</em>审议决议给予相应处理。</p>\n<p><b>第四十一条</b>　制度执行部门在制度执行中存在以下情形的，稽核审计部应将审查结果提交总经理办公会审议，公司经营层应视情节轻重给予批评、责令整改、追究相关人员责任等处理。（下列五种情形……）</p>", "why": "第四十条未规定<b>由谁查处</b>，“公司会议”亦为泛指，未明确是党委会、总经理办公会还是其他会议。<br><br>与第四十一条的关系也不清楚：第四十条泛指违规违纪违法责任，第四十一条列举五种具体情形并指定由本部门提交总经理办公会。两条的适用边界、是否存在先后顺序、“违纪违法”情形是否也走第四十一条的路径，均无规定。<br><br>实践中的后果是：第四十条因主体缺失而难以启动，第四十一条则因未设重要性标准而可能被宽泛适用——责任追究的入口一个太虚、一个太实。", "fix": "第四十条修改为：“制度执行中发现相关部门或个人涉嫌违规的，由制度归口管理部门提出处理建议，报公司主要负责人确定处理方式；涉嫌违纪的移送纪检室，涉嫌违法的移送司法机关。具体情形及处理程序按第四十一条执行。”", "risk": "本条涉及本部门在责任追究链条中的位置，与 Excel 中第四十一条的意见相互配合：第四十一条解决报告路径与重要性标准，本条解决查处主体与违纪违法情形的分流。建议与第四十一条一并提出，口径才完整。"}, {"id": "C1", "tier": "C", "clause": "第十二条 / 第十九条 / 第二十条（七）", "gist": "纪检室的廉洁性评估未嵌入立项流程，且与制度管理办公室的廉洁性审查重复", "quote": "<p><b>第十二条</b>　纪检室负责在制度评审前，对制度进行<em>廉洁性评估</em>，并将意见建议反馈至制度归口管理部门。</p>\n<p><b>第十九条</b>（立项应上传资料）　（一）制度文本；（二）上位制度文本；（三）关联制度名称；（四）征求意见采纳情况表；（五）修订对照表；（六）起草/修改说明。<span class=\"none\">——无“廉洁性评估意见”</span></p>\n<p><b>第二十条（七）</b>（办公室实质审查）　<em>制度廉洁性</em>是否起到强化管权管事管人的作用。</p>", "why": "第十二条要求纪检室在评审前完成廉洁性评估，但第十九条的立项上传资料清单中没有“廉洁性评估意见”，第二十条制度管理办公室的八项审查要点中也没有“是否已取得纪检室廉洁性评估意见”。纪检室这一环在流程上没有嵌入点，实际执行中容易被跳过。<br><br>同时，第二十条第（七）项由制度管理办公室（成员为综合管理部、法律合规部、计划财务部负责人，不含纪检室）再次审查廉洁性，与纪检室的专业评估重复，且可能出现口径不一致。", "fix": "第十九条资料清单增加“（七）纪检室廉洁性评估意见”；第二十条第（七）项修改为“是否已取得纪检室廉洁性评估意见，评估意见是否已采纳或说明未采纳理由”。", "risk": "纯流程断点，主责为综合管理部与纪检室。“制度里写了某部门的职责，但流程里没有接口”是典型的制度设计疏漏，指出即可，不带立场。"}, {"id": "C2", "tier": "C", "clause": "第九条", "gist": "制度管理办公室的议事与审核决策规则未规定", "quote": "<p><b>第九条</b>　公司成立制度管理办公室（下称“办公室”），办公室设在综合管理部，办公室成员包括：综合管理部部门负责人、法律合规部部门负责人、计划财务部部门负责人。办公室<em>负责对制度的废改立进行前置审核</em>。</p>", "why": "办公室由三名部门负责人组成，承担全部公司级制度的前置审核（第二十条规定了形式审查与八个方面的实质审查），但未规定其议事方式：审核结论如何形成，是否需要全体一致，意见分歧时如何处理，成员因故缺席时能否委托，审核是否有时限。第二十条仅规定“审核未通过的，应向制度提出部门说明理由”，对通过与否的决定规则没有依据。", "fix": "第九条增加一款：“办公室审核实行会签制，三名成员均签署同意方为通过；成员意见不一致的，由综合管理部汇总各方意见报公司分管领导协调确定。办公室应当自收到完整立项资料之日起十个工作日内完成审核。”", "risk": "与本部门无关。增加了办公室的程序约束，但同时也为办公室提供了处理分歧的依据，属于补齐而非施压。"}, {"id": "C3", "tier": "C", "clause": "第十一条", "gist": "“其他各职能部门根据职能职责分工对制度相关内容进行审核”过于笼统", "quote": "<p><b>第十一条</b>　其他各职能部门根据职能职责分工对制度相关内容进行审核。</p>", "why": "全条一句话，未明确：哪些部门、在哪个环节介入、审核什么内容、以何种形式出具意见、不反馈是否视为同意。与第十八条第（二）项“涉及多部门职责或跨领域业务的制度，应征求相关职能部门意见”存在关系不清——征求意见与审核是两种不同性质的程序（前者可不采纳，后者通常具有否决效果），本条未说明二者区别。", "fix": "第十一条修改为：“其他各职能部门在制度立项审核阶段，按职能分工对涉及本部门职责的制度内容出具书面意见，自收到之日起五个工作日内反馈；逾期未反馈的，视为无意见。本条所称审核意见不同于第十八条的征求意见，起草部门对未采纳的审核意见应当书面说明理由。”", "risk": "本次征求我部意见即依据此条。明确反馈时限与“逾期视为无意见”对各部门都有利，也使本部门今后回复制度意见的义务边界更清楚。"}, {"id": "C4", "tier": "C", "clause": "附件 5 备注 2", "gist": "“非实质性内容修订”范围不清、认定主体缺失", "quote": "<p><b>附件 5 备注 2</b>　制度修订时，若仅对<em>制度名称</em>、制度内涉及的部门名称<em>等</em>非实质性内容进行修订的，无需按照上述程序审批，经分管领导同意，报综合管理部备案即可。</p>", "why": "两个问题：其一，将“制度名称”列为非实质性内容并不妥当——制度名称往往对应其级别与适用范围（本办法第六条即以《办法》《规定》《细则》的后缀区分一至三级制度），改名可能实质改变制度层级。其二，“等”字为开放式表述，何为“非实质性”由谁认定未作规定，由归口部门自行判断并经分管领导同意即可，存在被用于规避正常审批程序的空间。", "fix": "备注 2 修改为：“制度修订时，若仅涉及文字表述订正、引用的部门名称变更、错漏更正等不涉及权责划分、业务流程、控制标准和制度层级的非实质性内容，经制度管理办公室确认属于非实质性修订后，报分管领导同意并报综合管理部备案即可。制度名称变更涉及制度层级调整的，按第三十五条执行。”", "risk": "与 B1（制度降级规避审批）是同一类问题的两个出口，建议同时提出，否则堵了一个仍留一个。"}, {"id": "C5", "tier": "C", "clause": "附件 4 第五项、第六项", "gist": "两处“5”指向不同对象易混淆；“修订 10 处”的“处”未定义", "quote": "<p><b>附件 4 第五项</b>　修改码：初次制定为 1，后续首次一般修订为 2，再次一般修订为 3，一般<em>不超过 5</em>。一般修订：<em>修订在 10 处以内</em>，且不涉及核心条款。</p>\n<p><b>附件 4 第六项</b>　原制度<em>一次修订在 10 处以上</em>或者制度<em>某一条款累计修订 5 次以上</em>时，一般应废除原制度编号，最新版本按照新订制度编号。</p>", "why": "第五项的“5”指修改码的上限（即制度整体的修订次数），第六项的“5”指单一条款的累计修订次数，两者对象不同但表述相近，执行中易混淆。<br><br>“修订 10 处”的“处”未定义——是按条、按款、按句还是按字计算？本次《飞机类项目投向指引》等制度的修订对照表均按“条”归纳，若按字句计算则几乎所有修订都超过 10 处，编号规则将失去区分作用。", "fix": "第五项修改为“修改码一般不超过 5，即制度经 4 次一般修订后应重新编号”；统一明确“修订处数以‘条’为计算单位，同一条内的多处文字修改计为一处”。", "risk": "纯技术性，主责为综合管理部。属于执行中必然会遇到的歧义，提出后基本不会有异议。"}, {"id": "C6", "tier": "C", "clause": "第二十五条", "gist": "保密条款中“未经批准”的批准主体未明确", "quote": "<p><b>第二十五条</b>　制度及相关材料，除依照法律规定或公司章程的规定需要公开披露外，<em>未经批准</em>，不得对外泄露、披露。</p>", "why": "未规定由谁批准。公司制度在实际工作中存在多种对外提供的情形——报送集团、提供给外部审计机构或律师事务所、监管检查调阅、投标时提供管理制度文件等，批准权限不明将导致要么无人敢批、要么各自为政。", "fix": "第二十五条增加：“对外提供制度文本的，应当经制度归口管理部门分管领导批准；涉及公司核心业务流程、风险控制标准的，报总经理批准。因监管检查、审计、诉讼等依法应当提供的，由承办部门办理并向综合管理部报备。”", "risk": "与本部门有轻微关联——外部审计、监管检查调阅制度时由承办部门办理，建议的表述已将此类情形单列为报备而非审批，不增加本部门负担。"}, {"id": "C7", "tier": "C", "clause": "第四十四条", "gist": "审议会议届次与生效日期为占位符，待审议通过后补齐", "quote": "<p><b>第四十四条</b>　本办法已经公司第 <em>xx</em> 次党委会议、2026 年第 <em>x</em> 次总经理办公会审议通过，自 2026 年 <em>x</em> 月 <em>xx</em> 日起发布施行，原 2025 版《制度管理办法》（茅台租赁制度发﹝2025﹞22 号）即时废止。</p>", "why": "占位符属正常的待定稿状态，提请起草部门在审议通过后补齐会议届次与生效日期。<br><br>另注意：本条同时规定原 2025 版即时废止，与第三十三条第（一）项“新旧替代废止，废止时应在新颁布的制度中注明”的要求一致，此处处理是规范的。", "fix": "审议通过后补齐会议届次、次数与生效日期。", "risk": "提醒性质，无对抗成本。可与其他技术性条款一并以“另有以下文字及待补事项”的形式附在意见末尾。"}]</script>
<script>

const TIERS=JSON.parse(document.getElementById("tiers-data").textContent);
const DATA=JSON.parse(document.getElementById("items-data").textContent);
const state={};
DATA.forEach(function(d){state[d.id]="pending";});

var tiersEl=document.getElementById("tiers");
TIERS.forEach(function(T){
  var items=DATA.filter(function(d){return d.tier===T.t;});
  var sec=document.createElement("section");
  sec.className="tier tier-"+T.t;
  var head=document.createElement("div");
  head.className="tier-head";
  head.innerHTML='<span class="tier-tag">'+T.t+' 档 · '+items.length+' 条</span>'
    +'<span class="tier-name">'+T.name+'</span><span class="tier-note">'+T.note+'</span>';
  sec.appendChild(head);
  items.forEach(function(d){sec.appendChild(mkItem(d));});
  tiersEl.appendChild(sec);
});

function mkItem(d){
  var el=document.createElement("article");
  el.className="item"; el.dataset.s="pending"; el.id="item-"+d.id;
  el.innerHTML='<div class="row">'
    +'<span class="idx">'+d.id+'</span>'
    +'<button type="button" class="rowmid" aria-expanded="false" aria-controls="d-'+d.id+'">'
      +'<span class="clause"><span class="chev">&#9654;</span>'+d.clause+'</span>'
      +'<span class="gist">'+d.gist+'</span>'
    +'</button>'
    +'<div class="toggle" role="group">'
      +'<button type="button" class="b-take" id="take-'+d.id+'" aria-pressed="false">提</button>'
      +'<button type="button" class="b-skip" id="skip-'+d.id+'" aria-pressed="false">不提</button>'
    +'</div></div>'
    +'<div class="detail hidden" id="d-'+d.id+'">'
      +'<div><h4>制度原文</h4><div class="quote">'+d.quote+'</div></div>'
      +'<div><h4>问题</h4><p>'+d.why+'</p></div>'
      +'<div><h4>建议修改为</h4><div class="fix"><p>'+d.fix+'</p></div></div>'
      +'<div class="risk"><span class="risk-lab">提出考量</span><span>'+d.risk+'</span></div>'
    +'</div>';
  var mid=el.querySelector(".rowmid"), det=el.querySelector(".detail");
  mid.addEventListener("click",function(){
    var open=det.classList.toggle("hidden")===false;
    el.classList.toggle("open",open);
    mid.setAttribute("aria-expanded",String(open));
  });
  el.querySelector(".b-take").addEventListener("click",function(){setS(d.id,"take");});
  el.querySelector(".b-skip").addEventListener("click",function(){setS(d.id,"skip");});
  return el;
}

function setS(id,v){ state[id]= state[id]===v ? "pending" : v; paint(); save(); }

function paint(){
  var take=0,skip=0,pend=0;
  DATA.forEach(function(d){
    var s=state[d.id]||"pending";
    if(s==="take"){take++;} else if(s==="skip"){skip++;} else {pend++;}
    var el=document.getElementById("item-"+d.id);
    if(!el){return;}
    el.dataset.s=s;
    document.getElementById("take-"+d.id).setAttribute("aria-pressed",String(s==="take"));
    document.getElementById("skip-"+d.id).setAttribute("aria-pressed",String(s==="skip"));
  });
  document.getElementById("n-take").textContent=take;
  document.getElementById("n-skip").textContent=skip;
  document.getElementById("n-pend").textContent=pend;
  var ul=document.getElementById("sumlist");
  var chosen=DATA.filter(function(d){return state[d.id]==="take";});
  if(chosen.length){
    ul.innerHTML=chosen.map(function(d){
      return '<li><span class="sidx">'+d.id+'</span><span><b>'+d.clause+'</b><br>'+d.gist+'</span></li>';
    }).join("");
  } else {
    ul.innerHTML='<li style="border:0"><span class="empty">尚未标注。</span></li>';
  }
}
paint();

function save(){
  try{ localStorage.setItem("zdreview4",JSON.stringify(state)); }catch(e){}
}
(function(){
  try{
    var raw=localStorage.getItem("zdreview4");
    if(raw){
      var saved=JSON.parse(raw);
      DATA.forEach(function(d){ if(saved[d.id]){state[d.id]=saved[d.id];} });
      paint();
    }
    document.getElementById("sync").innerHTML='标注<b>已存在本机浏览器</b>';
  }catch(e){}
})();

</script>
</body></html>
